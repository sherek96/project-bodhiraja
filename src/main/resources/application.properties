spring.datasource.url=jdbc:mysql://localhost:3306/pirivenaDB
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.application.name=pirivena

# The "Code-First" Magic
# 'update' tells Hibernate to create/alter tables based on your @Entity classes automatically
spring.jpa.hibernate.ddl-auto=update
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
app.upload.employee-dir=uploads/employees
app.upload.student-dir=uploads/students
app.upload.guardian-dir=uploads/guardians
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
